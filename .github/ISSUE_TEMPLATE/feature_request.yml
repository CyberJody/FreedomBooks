name: Feature request
description: Suggest something FreedomBooks should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search the existing issues first, and add a thumbs-up to a matching request instead of opening a new one.

        Some things are already planned: AI-assisted bank transaction matching, expense tracking for jobs, several computers on one company over the office network, users and roles, and importing from your old software. You are welcome to tell us how you would use them.

        Just exploring an idea? Start in Discussions instead: https://github.com/CyberJody/FreedomBooks/discussions/categories/ideas
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or problem, in your own words. For example, "I need to send a customer a statement of everything they owe at the end of the month."
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In FreedomBooks, in other software, or by hand.
    validations:
      required: false
  - type: textarea
    id: proposal
    attributes:
      label: What you would like FreedomBooks to do
      description: Describe what you would see and click. A sketch or screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who would use this
      options:
        - A one-person business
        - A small or medium business
        - A bookkeeper or accountant working for clients
        - Personal or household spending
        - Other
    validations:
      required: false
  - type: dropdown
    id: importance
    attributes:
      label: How important is it to you
      options:
        - I cannot use FreedomBooks without it
        - It would save me a lot of time
        - Nice to have
    validations:
      required: false
