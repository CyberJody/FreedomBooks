[package]
name = "fb-remote"
version = "0.1.0"
edition = "2024"
publish = false
description = "Remote access, network side: the TLS gateway on the host and the TLS client on a connected computer. Never links the book (fb-app, fb-db)."

[[bin]]
name = "fb-remote"
path = "src/main.rs"

[dependencies]
fb-remote-proto = { path = "../fb-remote-proto" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
getrandom = "0.3"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# The real-book end-to-end test only: the book process's adapter and a synthetic book. Never in
# fb-remote's normal graph (the gate checks it links no book crate).
fb-host = { path = "../fb-host" }
fb-app = { path = "../fb-app" }
fb-core = { path = "../fb-core" }
