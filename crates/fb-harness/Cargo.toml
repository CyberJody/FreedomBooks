[package]
name = "fb-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fb-core = { path = "../fb-core" }
fb-db = { path = "../fb-db" }
fb-ids = { path = "../fb-ids" }
fb-money = { path = "../fb-money" }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.3"
chrono = "0.4"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
uuid = { version = "1.18", features = ["v5"] }
regex = "1"
hkdf = "0.12"
chacha20poly1305 = "0.10"
zeroize = "1"

[dev-dependencies]
fb-db = { path = "../fb-db", features = ["test-support"] }
