[package]
name = "fb-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "Transport-neutral application layer: the session, commands and queries as plain data with a JSON schema, and screen view models."

[dependencies]
fb-core = { path = "../fb-core" }
fb-db = { path = "../fb-db" }
fb-ids = { path = "../fb-ids" }
fb-money = { path = "../fb-money" }
fb-templates = { path = "../fb-templates" }
fb-plugin-api = { path = "../fb-plugin-api", default-features = false }
hkdf = "0.12"
ring = "0.17"
data-encoding = "2"
subtle = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1.18", features = ["v4"] }
chrono-tz = "0.10"
qrcodegen = "=1.8.0"
percent-encoding = "2.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
simplefin = []
# Bank feeds, AI assistant and receipt reader (plugins). Off in release builds: hidden, refused.
plugins = []
key-test-hooks = ["fb-db/key-test-hooks"]

[dev-dependencies]
tempfile = "3"
fb-harness = { path = "../fb-harness" }
sha2 = "0.10"
fb-db = { path = "../fb-db", features = ["test-support"] }
# WAVE4 plugin tests only (fake providers on 127.0.0.1); never in the normal graph.
fb-plugin-testkit = { path = "../fb-plugin-testkit" }
base64 = "0.22.1"
url = "2.5"
proptest = "1"
