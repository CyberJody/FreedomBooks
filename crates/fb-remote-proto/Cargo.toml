[package]
name = "fb-remote-proto"
version = "0.1.0"
edition = "2024"
publish = false
description = "Remote access, book side: wire types, framing, and the host dispatcher that maps remote requests onto the session API. Links no network or TLS stack."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
