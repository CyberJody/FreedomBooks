[package]
name = "fb-db"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fb-money = { path = "../fb-money" }
rust_decimal = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl", "collation", "functions", "hooks", "backup"] }

icu_collator = { version = "=2.4.0", features = ["compiled_data"] }
icu_locale = "=2.4.0"
icu_casemap = { version = "=2.4.0", features = ["compiled_data"] }

sha2 = "0.10"
regex = "1"
chacha20poly1305 = "0.10"
zeroize = "1"

[features]
# Deliberate escape hatch for integration attacks only. Never enable in product crates.
test-support = []
key-test-hooks = []

[dev-dependencies]
tempfile = "3"
# fb-db's own integration attacks (tests/backups.rs) use the raw connection; enable the hatch for this
# crate's tests only, so `cargo test -p fb-db` builds without workspace feature unification.
fb-db = { path = ".", features = ["test-support"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
libc = "0.2"
