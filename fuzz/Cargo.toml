[package]
name = "freedombooks-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
description = "cargo-fuzz targets for every parser of untrusted input in the FreedomBooks v2 workspace (find-don't-fix audit, 2026-11)."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tar = "0.4"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
rust_decimal = "1"
sha2 = "0.10"
url = "2.5"
zeroize = "1"

fb-money = { path = "../crates/fb-money" }
fb-ids = { path = "../crates/fb-ids" }
fb-db = { path = "../crates/fb-db" }
fb-core = { path = "../crates/fb-core" }
fb-app = { path = "../crates/fb-app" }
fb-templates = { path = "../crates/fb-templates" }
fb-plugin-api = { path = "../crates/fb-plugin-api" }
fb-plugin-simplefin = { path = "../crates/fb-plugins/simplefin" }
fb-plugin-openai = { path = "../crates/fb-plugins/openai" }

# Independent workspace: the product workspace is not touched.
[workspace]
members = ["."]

[profile.release]
debug = 1

# One [[bin]] per parser; fuzz/README.md says what each one covers and how it was run.

[[bin]]
name = "money_text"
path = "fuzz_targets/money_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "py_dates"
path = "fuzz_targets/py_dates.rs"
test = false
doc = false
bench = false

